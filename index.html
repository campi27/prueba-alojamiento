<title>Iria Piruja 🧙‍♀️</title>
<style>
:root{--bg:#160b22;--panel:#241232;--panel2:#321746;--text:#fff8ff;--muted:#d8c5df;--accent:#d98cff;--good:#54d68b;--bad:#ff6f91}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#43205d 0,#160b22 55%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}
main{width:min(720px,94vw);margin:0 auto;padding:28px 0 42px}
.hero{text-align:center;padding:10px 0 20px}.moon{font-size:48px}.title{font-size:clamp(38px,9vw,68px);font-weight:900;letter-spacing:-2px;margin:4px 0}.subtitle{color:var(--muted)}
.progress{height:8px;background:#4a2a59;border-radius:99px;overflow:hidden;margin:10px 0 24px}.bar{height:100%;width:50%;background:var(--accent);transition:.3s}
.card{background:rgba(36,18,50,.95);border:1px solid #684177;border-radius:24px;padding:24px;box-shadow:0 18px 50px #0006}
.q{font-size:24px;font-weight:800;margin:0 0 18px}.answers{display:grid;gap:12px}
button{font:inherit;color:inherit}.answer{border:1px solid #714a80;background:#321746;border-radius:16px;padding:16px;text-align:left;cursor:pointer;min-height:58px;transition:.15s}.answer:hover{transform:translateY(-1px);border-color:var(--accent)}.answer:disabled{cursor:default;opacity:.95}.letter{font-weight:900;color:var(--accent);display:inline-block;width:30px}
.feedback{margin-top:16px;padding:14px;border-radius:14px;display:none}.feedback.good{display:block;background:#173d2a;border:1px solid #3f9e69}.feedback.bad{display:block;background:#4a1b2c;border:1px solid #a84b66}
.next{display:none;margin-top:14px;width:100%;border:0;border-radius:15px;padding:15px;background:var(--accent);color:#211027;font-weight:900;cursor:pointer}.next.show{display:block}
.photo-row{display:flex;gap:12px;margin:18px 0}.photo{height:130px;flex:1;object-fit:cover;border-radius:18px;border:1px solid #684177}
.result{text-align:center;display:none}.result.show{display:block}.score{font-size:54px;font-weight:900;color:var(--accent)}.restart{border:0;border-radius:15px;padding:14px 22px;background:var(--accent);color:#211027;font-weight:900;cursor:pointer}
.small{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
</style>

 {q:"¿Quién es más bruja?", opts:["Bini","Iria","Campi","Piruja"], correct:1},

const qEl=document.getElementById("question"), aEl=document.getElementById("answers"), fEl=document.getElementById("feedback"), next=document.getElementById("next"), bar=document.getElementById("bar");

 x.opts.forEach((o,i)=>{const b=document.createElement("button");b.type="button";b.className="answer";b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'.</span>'+o;b.addEventListener("click",()=>answer(i));aEl.appendChild(b)});
}
function answer(i){
 if(locked)return; locked=true; const x=questions[n], buttons=[...aEl.children]; buttons.forEach(b=>b.disabled=true);
 if(i===x.correct){score++;fEl.className="feedback good";fEl.textContent="✨ ¡Correcto! La bruja sabía la respuesta."}
 else{fEl.className="feedback bad";fEl.textContent="🧹 ¡Incorrecto! La respuesta era "+String.fromCharCode(65+x.correct)+": "+x.opts[x.correct]+"."}
 next.className="next show"; next.textContent=n===questions.length-1?"Ver resultado →":"Siguiente pregunta →";
}
next.addEventListener("click",()=>{n++;if(n<questions.length)render();else{document.getElementById("game").style.display="none";document.getElementById("result").classList.add("show");document.getElementById("score").textContent=score+" / "+questions.length;document.getElementById("resultText").textContent=score===2?"Nivel bruja: LEGENDARIA 🧙‍♀️":"Necesitas más entrenamiento en el aquelarre 🪄"}});
document.getElementById("restart").addEventListener("click",()=>{n=0;score=0;document.getElementById("result").classList.remove("show");document.getElementById("game").style.display="block";render()});
render();
</script>
